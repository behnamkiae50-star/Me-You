<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی زوجی</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a0a;
    --surface:#181212;
    --surface-2:#201515;
    --border:#3d1c1c;
    --border-soft:#2a1414;
    --accent:#c9222f;
    --accent-dim:#7a1620;
    --gold:#e2483f;
    --text:#f2e8e8;
    --text-dim:#a08585;
    --text-faint:#705858;
    --danger:#8a3339;
    --radius:16px;
  }
  *{box-sizing:border-box;}
  html{background:#0c0a0a;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:#0c0a0a;
    color:var(--text);
    min-height:100vh;
    padding-bottom:48px;
  }
  header{
    padding:32px 20px 20px;
    text-align:center;
  }
  header .kicker{
    font-size:12px;
    color:var(--gold);
    letter-spacing:2px;
    margin:0 0 8px;
  }
  header h1{
    margin:0;
    font-size:26px;
    font-weight:700;
    letter-spacing:0.3px;
  }

  .tabs{
    position:relative;
    display:flex;
    gap:4px;
    padding:20px 16px 0;
    max-width:520px;
    margin:0 auto;
    border-bottom:1px solid var(--border-soft);
  }
  .tab-btn{
    flex:1;
    background:transparent;
    border:none;
    color:var(--text-dim);
    padding:12px 6px 14px;
    font-size:13px;
    font-family:inherit;
    font-weight:500;
    cursor:pointer;
    position:relative;
    transition:color .2s;
  }
  .tab-btn.active{color:var(--text);}
  .tab-underline{
    position:absolute;
    bottom:-1px;
    height:2px;
    background:var(--accent);
    border-radius:2px;
    transition:right .28s cubic-bezier(.4,0,.2,1), width .28s cubic-bezier(.4,0,.2,1);
  }

  main{
    padding:24px 16px;
    max-width:520px;
    margin:0 auto;
  }
  .panel{display:none;}
  .panel.active{display:block;}

  .picker{
    background:linear-gradient(160deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    border-radius:20px;
    padding:32px 22px 26px;
    text-align:center;
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  .result-stage{
    min-height:74px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:10px;
    padding:6px;
  }
  .result-img{
    max-width:100%;
    max-height:180px;
    border-radius:12px;
    display:none;
    object-fit:cover;
    margin-bottom:6px;
  }
  .result-text{
    font-size:18px;
    line-height:1.75;
    font-weight:500;
  }
  .result-text.empty{
    color:var(--text-faint);
    font-size:14px;
    font-weight:400;
  }
  .result-text.rolling{
    color:var(--text-dim);
  }
  @keyframes settleIn{
    0%{opacity:0; transform:translateY(6px) scale(.97);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .result-text.settled, .result-img.settled{
    animation:settleIn .32s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes ringPulse{
    0%{box-shadow:0 0 0 0 rgba(201,34,47,0.55);}
    100%{box-shadow:0 0 0 18px rgba(201,34,47,0);}
  }
  .picker.pulsing::before{
    content:'';
    position:absolute;
    inset:0;
    border-radius:20px;
    animation:ringPulse .5s ease-out;
    pointer-events:none;
  }

  .roll-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:15px 20px;
    font-size:15px;
    font-family:inherit;
    font-weight:600;
    width:100%;
    cursor:pointer;
    margin-top:16px;
    transition:transform .12s, background .2s;
  }
  .roll-btn:active{transform:scale(0.97);}
  .roll-btn:disabled{background:var(--surface);color:var(--text-faint);cursor:not-allowed;}

  .add-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
  }
  .add-row{
    display:flex;
    gap:8px;
  }
  .add-row input[type=text]{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:12px 14px;
    color:var(--text);
    font-size:14px;
    font-family:inherit;
    min-width:0;
  }
  .add-row input[type=text]:focus{
    outline:none;
    border-color:var(--accent);
  }
  .add-row button.add-submit{
    background:var(--accent);
    border:none;
    color:#fff;
    border-radius:10px;
    padding:0 18px;
    font-size:20px;
    cursor:pointer;
    flex:0 0 auto;
  }
  .image-attach{
    margin-top:10px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .image-attach label.file-btn{
    background:var(--surface-2);
    border:1px dashed var(--border);
    color:var(--text-dim);
    border-radius:10px;
    padding:9px 14px;
    font-size:12px;
    cursor:pointer;
    display:inline-block;
  }
  .image-attach input[type=file]{display:none;}
  .image-attach .thumb{
    width:36px;
    height:36px;
    border-radius:8px;
    object-fit:cover;
    display:none;
    border:1px solid var(--border);
  }
  .image-attach .clear-img{
    display:none;
    background:none;
    border:none;
    color:var(--text-faint);
    font-size:16px;
    cursor:pointer;
  }
  .error-text{
    color:var(--gold);
    font-size:12px;
    margin:10px 2px 0;
    display:none;
  }

  .accordion{
    border:1px solid var(--border-soft);
    border-radius:var(--radius);
    overflow:hidden;
  }
  .accordion-head{
    width:100%;
    background:var(--surface);
    border:none;
    color:var(--text);
    padding:14px 16px;
    font-size:13px;
    font-family:inherit;
    font-weight:500;
    display:flex;
    justify-content:space-between;
    align-items:center;
    cursor:pointer;
  }
  .accordion-head .count{color:var(--text-dim); font-weight:400;}
  .chevron{
    transition:transform .25s;
    color:var(--text-dim);
    font-size:12px;
  }
  .accordion-head.open .chevron{transform:rotate(180deg);}
  .accordion-body{
    max-height:0;
    overflow:hidden;
    transition:max-height .3s ease;
    background:var(--bg);
  }
  .accordion-body-inner{
    padding:12px;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  ul.item-list{
    list-style:none;
    margin:0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  ul.item-list li{
    background:var(--surface);
    border:1px solid var(--border-soft);
    border-radius:10px;
    padding:10px 12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    font-size:13.5px;
  }
  ul.item-list li .li-main{
    flex:1;
    display:flex;
    align-items:center;
    gap:10px;
    min-width:0;
  }
  ul.item-list li img.li-thumb{
    width:34px;
    height:34px;
    border-radius:7px;
    object-fit:cover;
    flex:0 0 auto;
  }
  ul.item-list li span{
    flex:1;
    word-break:break-word;
  }
  ul.item-list li button.del-btn{
    background:transparent;
    border:none;
    color:var(--text-faint);
    font-size:18px;
    cursor:pointer;
    line-height:1;
    padding:2px 6px;
    flex:0 0 auto;
  }
  ul.item-list li button.del-btn:hover{color:var(--danger);}
  .empty-state{
    text-align:center;
    color:var(--text-faint);
    font-size:12.5px;
    padding:18px 10px;
  }
  .status{
    text-align:center;
    font-size:12px;
    color:var(--text-faint);
    padding:6px;
    min-height:18px;
  }
</style>
</head>
<body>

<header>
  <p class="kicker">فقط برای دو نفر</p>
  <h1>بازی زوجی</h1>
</header>

<div class="tabs" id="tabs"></div>

<main id="main"></main>

<div class="status" id="status"></div>

<script>
const CATEGORIES = [
  { id: 'questions', label: 'سوالات چالشی', itemLabel: 'سوال', placeholder: 'متن سوال را بنویس', hasImage: false },
  { id: 'positions', label: 'پوزیشن شانسی', itemLabel: 'پوزیشن', placeholder: 'نام پوزیشن را بنویس', hasImage: true },
  { id: 'scenarios', label: 'سناریو', itemLabel: 'سناریو', placeholder: 'متن سناریو را بنویس', hasImage: false },
  { id: 'truthdare', label: 'جرات یا حقیقت', itemLabel: 'آیتم', placeholder: 'جرات یا حقیقت را بنویس', hasImage: false }
];

let state = {};
CATEGORIES.forEach(c => state[c.id] = []);
let activeTab = CATEGORIES[0].id;
let accordionOpen = {};
CATEGORIES.forEach(c => accordionOpen[c.id] = false);
let pendingImage = {};

const STORAGE_KEY = 'couple-game-data-v2';
let idCounter = 1;
function nextId(){ return 'i' + (idCounter++); }

function normalizeItem(raw){
  if (typeof raw === 'string') return { id: nextId(), text: raw, image: null };
  return { id: raw.id || nextId(), text: raw.text || '', image: raw.image || null };
}

async function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      CATEGORIES.forEach(c => {
        const arr = Array.isArray(parsed[c.id]) ? parsed[c.id] : [];
        state[c.id] = arr.map(normalizeItem);
      });
    }
  } catch (e) {
    // no existing data
  }
  setStatus('');
  render();
}

async function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    setStatus('');
  } catch (e) {
    setStatus('ذخیره نشد، حافظه مرورگر پر شده');
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATEGORIES.forEach(c => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (c.id === activeTab ? ' active' : '');
    btn.textContent = c.label;
    btn.dataset.id = c.id;
    btn.onclick = () => { activeTab = c.id; render(); };
    tabsEl.appendChild(btn);
  });
  const underline = document.createElement('div');
  underline.className = 'tab-underline';
  tabsEl.appendChild(underline);
  requestAnimationFrame(() => {
    const activeBtn = tabsEl.querySelector('.tab-btn.active');
    if (activeBtn) {
      underline.style.width = activeBtn.offsetWidth + 'px';
      underline.style.right = activeBtn.offsetLeft + 'px';
    }
  });
}

function render() {
  renderTabs();
  const main = document.getElementById('main');
  main.innerHTML = '';
  CATEGORIES.forEach(c => {
    const panel = document.createElement('div');
    panel.className = 'panel' + (c.id === activeTab ? ' active' : '');
    panel.appendChild(buildPicker(c));
    panel.appendChild(buildAddCard(c));
    panel.appendChild(buildAccordion(c));
    main.appendChild(panel);
  });
}

function buildPicker(c) {
  const wrap = document.createElement('div');
  wrap.className = 'picker';
  wrap.id = 'picker-' + c.id;

  const stage = document.createElement('div');
  stage.className = 'result-stage';

  const img = document.createElement('img');
  img.className = 'result-img';
  img.id = 'result-img-' + c.id;

  const textEl = document.createElement('div');
  textEl.id = 'result-text-' + c.id;
  const items = state[c.id];
  if (items.length === 0) {
    textEl.className = 'result-text empty';
    textEl.textContent = 'هنوز آیتمی اضافه نکردی';
  } else {
    textEl.className = 'result-text empty';
    textEl.textContent = 'برای شروع، بزن بچرخه';
  }

  stage.appendChild(img);
  stage.appendChild(textEl);
  wrap.appendChild(stage);

  const btn = document.createElement('button');
  btn.className = 'roll-btn';
  btn.textContent = 'بچرخون';
  btn.disabled = items.length === 0;
  btn.onclick = () => rollFor(c, wrap, textEl, img, btn);
  wrap.appendChild(btn);

  return wrap;
}

function rollFor(c, wrapEl, textEl, imgEl, btn) {
  const list = state[c.id];
  if (list.length === 0) return;
  btn.disabled = true;
  textEl.className = 'result-text rolling';
  imgEl.style.display = 'none';
  imgEl.classList.remove('settled');

  let ticks = 0;
  const maxTicks = 10;
  const interval = setInterval(() => {
    const r = list[Math.floor(Math.random() * list.length)];
    textEl.textContent = r.text || '...';
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      const final = list[Math.floor(Math.random() * list.length)];
      textEl.textContent = final.text;
      textEl.className = 'result-text settled';
      if (final.image) {
        imgEl.src = final.image;
        imgEl.style.display = 'block';
        imgEl.classList.add('settled');
      }
      wrapEl.classList.add('pulsing');
      setTimeout(() => wrapEl.classList.remove('pulsing'), 550);
      btn.disabled = false;
    }
  }, 70);
}

function resizeImageFile(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) {
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function buildAddCard(c) {
  const wrap = document.createElement('div');
  wrap.className = 'add-card';

  const row = document.createElement('div');
  row.className = 'add-row';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = c.placeholder;

  const addBtn = document.createElement('button');
  addBtn.className = 'add-submit';
  addBtn.textContent = '+';
  addBtn.setAttribute('aria-label', 'افزودن');

  const errorText = document.createElement('div');
  errorText.className = 'error-text';
  errorText.textContent = 'چیزی بنویس';

  row.appendChild(input);
  row.appendChild(addBtn);
  wrap.appendChild(row);

  if (c.hasImage) {
    pendingImage[c.id] = null;
    const attach = document.createElement('div');
    attach.className = 'image-attach';

    const fileId = 'file-' + c.id;
    const label = document.createElement('label');
    label.className = 'file-btn';
    label.setAttribute('for', fileId);
    label.textContent = 'افزودن عکس';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.id = fileId;

    const thumb = document.createElement('img');
    thumb.className = 'thumb';

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-img';
    clearBtn.textContent = '×';
    clearBtn.setAttribute('aria-label', 'حذف عکس');

    fileInput.addEventListener('change', async () => {
      const f = fileInput.files[0];
      if (!f) return;
      label.textContent = 'در حال آماده‌سازی...';
      try {
        const dataUrl = await resizeImageFile(f, 480, 0.75);
        pendingImage[c.id] = dataUrl;
        thumb.src = dataUrl;
        thumb.style.display = 'block';
        clearBtn.style.display = 'inline-block';
        label.textContent = 'تغییر عکس';
      } catch (e) {
        label.textContent = 'افزودن عکس';
        setStatus('بارگذاری عکس ناموفق بود');
      }
    });

    clearBtn.onclick = () => {
      pendingImage[c.id] = null;
      fileInput.value = '';
      thumb.style.display = 'none';
      clearBtn.style.display = 'none';
      label.textContent = 'افزودن عکس';
    };

    attach.appendChild(label);
    attach.appendChild(fileInput);
    attach.appendChild(thumb);
    attach.appendChild(clearBtn);
    wrap.appendChild(attach);
  }

  wrap.appendChild(errorText);

  function submit() {
    const val = input.value.trim();
    if (!val) {
      errorText.style.display = 'block';
      return;
    }
    errorText.style.display = 'none';
    const item = { id: nextId(), text: val, image: c.hasImage ? (pendingImage[c.id] || null) : null };
    state[c.id].push(item);
    input.value = '';
    if (c.hasImage) {
      pendingImage[c.id] = null;
    }
    saveData();
    render();
  }

  input.addEventListener('input', () => { errorText.style.display = 'none'; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  addBtn.onclick = submit;

  return wrap;
}

function buildAccordion(c) {
  const wrap = document.createElement('div');
  wrap.className = 'accordion';

  const head = document.createElement('button');
  head.className = 'accordion-head' + (accordionOpen[c.id] ? ' open' : '');
  const items = state[c.id];

  const labelSpan = document.createElement('span');
  labelSpan.innerHTML = 'لیست ' + c.label + ' <span class="count">(' + items.length + ')</span>';
  const chev = document.createElement('span');
  chev.className = 'chevron';
  chev.textContent = '▾';

  head.appendChild(labelSpan);
  head.appendChild(chev);

  const body = document.createElement('div');
  body.className = 'accordion-body';

  const inner = document.createElement('div');
  inner.className = 'accordion-body-inner';

  if (items.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    empty.textContent = 'لیست خالیه. اولین ' + c.itemLabel + ' رو اضافه کن.';
    inner.appendChild(empty);
  } else {
    const ul = document.createElement('ul');
    ul.className = 'item-list';
    items.forEach((item, idx) => {
      const li = document.createElement('li');
      const liMain = document.createElement('div');
      liMain.className = 'li-main';
      if (item.image) {
        const thumb = document.createElement('img');
        thumb.className = 'li-thumb';
        thumb.src = item.image;
        liMain.appendChild(thumb);
      }
      const span = document.createElement('span');
      span.textContent = item.text;
      liMain.appendChild(span);

      const delBtn = document.createElement('button');
      delBtn.className = 'del-btn';
      delBtn.textContent = '×';
      delBtn.setAttribute('aria-label', 'حذف');
      delBtn.onclick = () => {
        state[c.id].splice(idx, 1);
        saveData();
        render();
      };
      li.appendChild(liMain);
      li.appendChild(delBtn);
      ul.appendChild(li);
    });
    inner.appendChild(ul);
  }

  body.appendChild(inner);

  head.onclick = () => {
    accordionOpen[c.id] = !accordionOpen[c.id];
    head.classList.toggle('open', accordionOpen[c.id]);
    if (accordionOpen[c.id]) {
      body.style.maxHeight = inner.scrollHeight + 'px';
    } else {
      body.style.maxHeight = '0px';
    }
  };

  wrap.appendChild(head);
  wrap.appendChild(body);

  if (accordionOpen[c.id]) {
    requestAnimationFrame(() => { body.style.maxHeight = inner.scrollHeight + 'px'; });
  }

  return wrap;
}

loadData();
</script>

</body>
</html>
