<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0808">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Sex Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0808;
    --surface:#150f10;
    --surface-2:#1c1314;
    --border:#3a1f20;
    --border-soft:#291819;
    --hairline:rgba(198,40,50,0.28);
    --accent:#8f1720;
    --accent-bright:#d42834;
    --text:#f5eceb;
    --text-dim:#a58f8a;
    --text-faint:#6f5c58;
    --danger:#c0303a;
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html{background:#0a0808;}
  html,body{margin:0;padding:0;min-height:100%;}
  body{
    font-family:'Vazirmatn',Tahoma,sans-serif;
    background:#0a0808;
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y:none;
  }
  .app-shell{
    background:#0a0808;
    min-height:100vh;
    min-height:100dvh;
    padding-top:env(safe-area-inset-top);
    padding-bottom:calc(52px + env(safe-area-inset-bottom));
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }

  header{
    padding:36px 20px 14px;
    text-align:center;
    position:relative;
    background:radial-gradient(600px 220px at 50% 0%, rgba(143,23,32,0.55), rgba(10,8,8,0) 70%);
  }
  header .kicker{
    font-size:11px;
    color:var(--accent-bright);
    letter-spacing:4px;
    margin:0 0 8px;
    font-weight:500;
  }
  header h1{
    margin:0;
    font-family:'Amiri','Vazirmatn',serif;
    font-size:32px;
    font-weight:700;
    letter-spacing:1px;
    color:#fff;
    text-shadow:0 0 18px rgba(212,40,52,0.55);
    direction:ltr;
  }
  .back-btn{
    position:absolute;
    top:36px;
    right:20px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text-dim);
    border-radius:10px;
    padding:8px 12px;
    font-size:12px;
    font-family:inherit;
    cursor:pointer;
  }
  .manage-corner-btn{
    position:absolute;
    top:36px;
    left:20px;
    width:34px;
    height:34px;
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text-dim);
    border-radius:10px;
    font-size:14px;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
  }
  .manage-corner-btn:active{color:var(--accent-bright); border-color:var(--accent-bright);}
  .ornament{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin:14px auto 0;
    max-width:220px;
  }
  .ornament .line{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--accent-bright), transparent);
    opacity:0.65;
  }
  .ornament .gem{
    width:6px;
    height:6px;
    background:var(--accent-bright);
    transform:rotate(45deg);
    box-shadow:0 0 8px rgba(212,40,52,0.8);
    flex:0 0 auto;
  }

  main{
    padding:18px 16px 24px;
    max-width:520px;
    margin:0 auto;
  }
  .view{display:none;}
  .view.active{display:block;}
  .view.active.home-view,
  .view.active.dice-view,
  .view.active.turn-view,
  .view.active.lock-view{display:flex;}

  /* ---------- Home ---------- */
  .home-view{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-top:8px;
  }
  .big-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:26px 20px;
    border-radius:20px;
    font-family:inherit;
    cursor:pointer;
    border:1px solid var(--border);
    width:100%;
  }
  .big-btn .icon{font-size:26px;}
  .big-btn .title{font-size:16px; font-weight:700;}
  .big-btn .sub{font-size:12px; color:var(--text-dim);}
  .big-btn.primary{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent) 70%);
    box-shadow:0 14px 30px -14px rgba(143,23,32,0.75), inset 0 1px 0 rgba(255,255,255,0.08);
    border-color:rgba(255,255,255,0.12);
  }
  .big-btn.primary .title{color:#fff;}
  .big-btn.primary .sub{color:rgba(255,255,255,0.75);}
  .big-btn.secondary{
    background:var(--surface);
  }
  .big-btn.secondary .title{color:var(--text);}

  /* ---------- Dice ---------- */
  .dice-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    min-height:60vh;
    min-height:60dvh;
    padding-top:10px;
  }
  .dice-msg{
    text-align:center;
    font-size:14px;
    color:var(--text-dim);
    min-height:20px;
  }
  .dice-msg.win{
    color:#ff5b64;
    font-family:'Amiri','Vazirmatn',serif;
    font-size:20px;
    font-weight:700;
    text-shadow:0 0 14px rgba(212,40,52,0.6);
  }
  .dice-stage{
    display:flex;
    gap:22px;
  }
  .die{
    width:78px;
    height:78px;
    background:linear-gradient(165deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    border-radius:16px;
    box-shadow:0 14px 26px -14px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.04);
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(3,1fr);
    padding:12px;
  }
  .die.rolling{animation:diceShake .12s infinite;}
  @keyframes diceShake{
    0%{transform:rotate(0deg);}
    50%{transform:rotate(-6deg);}
    100%{transform:rotate(6deg);}
  }
  .pip{
    width:100%;
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .pip::after{
    content:'';
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--text);
    opacity:0;
  }
  .pip.lit::after{opacity:1;}
  .die.sex-face{
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .die.sex-face .sex-label{
    font-family:'Amiri','Vazirmatn',serif;
    font-weight:700;
    font-size:18px;
    letter-spacing:1px;
    color:#ff5b64;
    text-shadow:0 0 10px rgba(212,40,52,0.7);
    direction:ltr;
  }
  .roll-dice-btn{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent) 70%);
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:13px;
    padding:16px 32px;
    font-size:14.5px;
    font-family:inherit;
    font-weight:700;
    letter-spacing:0.5px;
    cursor:pointer;
    margin-top:16px;
    box-shadow:0 10px 24px -12px rgba(143,23,32,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .roll-dice-btn:disabled{opacity:0.5; cursor:not-allowed;}
  .continue-btn{
    background:var(--surface);
    color:var(--text);
    border:1px solid var(--accent-bright);
    border-radius:13px;
    padding:14px 28px;
    font-size:14px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    margin-top:16px;
  }
  .giveup-btn{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent) 70%);
    color:#fff;
    border:2px solid var(--accent-bright);
    border-radius:16px;
    padding:22px 28px;
    font-size:16px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    margin-top:0;
    max-width:320px;
    line-height:1.7;
    box-shadow:0 14px 30px -14px rgba(143,23,32,0.75), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .giveup-btn:active{opacity:0.9;}

  /* ---------- Turn select ---------- */
  .turn-view{
    display:flex;
    flex-direction:column;
    gap:14px;
    padding-top:6px;
  }
  .turn-heading{
    text-align:center;
    font-family:'Amiri','Vazirmatn',serif;
    font-size:19px;
    font-weight:700;
    color:#fff;
    margin-bottom:6px;
  }
  .turn-group{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:10px;
  }
  .turn-icon{
    width:34px;
    height:34px;
    color:var(--accent-bright);
    opacity:0.85;
  }
  .turn-btn{
    width:100%;
    background:linear-gradient(165deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    border-radius:18px;
    padding:22px 18px;
    text-align:center;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    color:var(--text);
    cursor:pointer;
    box-shadow:0 0 0 1px var(--hairline);
  }
  .turn-btn:active{transform:scale(0.98);}

  /* ---------- Turn badge (play view) ---------- */
  .turn-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    margin:0 auto 14px;
    background:var(--surface);
    border:1px solid var(--accent-bright);
    border-radius:999px;
    padding:8px 18px;
    font-size:12.5px;
    color:var(--text);
    width:fit-content;
  }
  .turn-badge b{color:#ff5b64;}

  .progress{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:6px 16px 0;
  }
  .progress .dot-wrap{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .progress .dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--surface-2);
    border:1px solid var(--border);
    transition:background .25s, border-color .25s, transform .25s;
  }
  .progress .dot.done{
    background:var(--accent-bright);
    border-color:var(--accent-bright);
  }
  .progress .dot.current{
    background:var(--accent-bright);
    border-color:var(--accent-bright);
    transform:scale(1.35);
    box-shadow:0 0 8px rgba(212,40,52,0.8);
  }
  .progress .seg{
    width:22px;
    height:1px;
    background:var(--border);
  }
  .progress .seg.done{background:var(--accent-bright);}

  .step-label{
    text-align:center;
    font-size:12px;
    color:var(--text-dim);
    letter-spacing:1px;
    padding:14px 16px 18px;
  }
  .step-label b{
    color:var(--text);
    font-weight:600;
  }

  .picker{
    background:linear-gradient(165deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.02),
      0 0 0 1px var(--hairline),
      0 18px 40px -20px rgba(0,0,0,0.7);
    border-radius:22px;
    padding:32px 22px 24px;
    text-align:center;
    margin-bottom:20px;
    position:relative;
    overflow:hidden;
  }
  .picker::before{
    content:'';
    position:absolute;
    top:-40%;
    left:50%;
    width:200%;
    height:80%;
    transform:translateX(-50%);
    background:radial-gradient(closest-side, rgba(143,23,32,0.35), transparent);
    pointer-events:none;
  }
  .result-stage{
    min-height:78px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:12px;
    padding:6px;
    position:relative;
  }
  .result-img{
    max-width:100%;
    max-height:190px;
    border-radius:14px;
    display:none;
    object-fit:cover;
    margin-bottom:6px;
    border:1px solid var(--hairline);
  }
  .result-text{
    font-family:'Amiri','Vazirmatn',serif;
    font-size:20px;
    line-height:1.85;
    font-weight:700;
    color:var(--text);
  }
  .result-text.empty{
    color:var(--text-faint);
    font-size:13.5px;
    font-weight:400;
    font-family:'Vazirmatn',sans-serif;
  }
  .result-text.rolling{
    color:var(--accent-bright);
    opacity:0.9;
  }
  @keyframes settleIn{
    0%{opacity:0; transform:translateY(6px) scale(.97);}
    100%{opacity:1; transform:translateY(0) scale(1);}
  }
  .result-text.settled, .result-img.settled{
    animation:settleIn .35s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes ringPulse{
    0%{box-shadow:0 0 0 0 rgba(212,40,52,0.55);}
    100%{box-shadow:0 0 0 20px rgba(212,40,52,0);}
  }
  .picker.pulsing::after{
    content:'';
    position:absolute;
    inset:0;
    border-radius:22px;
    animation:ringPulse .6s ease-out;
    pointer-events:none;
  }

  .roll-btn{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent) 70%);
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:13px;
    padding:16px 20px;
    font-size:14.5px;
    font-family:inherit;
    font-weight:700;
    letter-spacing:0.5px;
    width:100%;
    cursor:pointer;
    margin-top:16px;
    box-shadow:0 10px 24px -12px rgba(143,23,32,0.7), inset 0 1px 0 rgba(255,255,255,0.08);
    transition:transform .12s, box-shadow .2s;
  }
  .roll-btn:active{transform:scale(0.97);}
  .roll-btn:disabled{
    background:var(--surface);
    color:var(--text-faint);
    border-color:var(--border-soft);
    box-shadow:none;
    cursor:not-allowed;
  }

  .nav-row{
    display:flex;
    gap:10px;
    margin-bottom:22px;
  }
  .nav-btn{
    flex:1;
    border-radius:13px;
    padding:15px 16px;
    font-size:14px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
    border:1px solid var(--border);
  }
  .nav-btn.prev{
    background:var(--surface);
    color:var(--text-dim);
  }
  .nav-btn.prev:disabled{
    opacity:0.4;
    cursor:not-allowed;
  }
  .nav-btn.next{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent));
    color:#fff;
    border-color:rgba(255,255,255,0.12);
    box-shadow:0 10px 24px -12px rgba(143,23,32,0.7);
    flex:2;
  }
  .nav-btn.next:disabled{
    background:var(--surface);
    color:var(--text-faint);
    box-shadow:none;
    border-color:var(--border-soft);
    cursor:not-allowed;
  }

  /* ---------- Summary ---------- */
  .summary-card{
    background:linear-gradient(165deg, var(--surface-2), var(--surface));
    border:1px solid var(--border);
    box-shadow:0 0 0 1px var(--hairline), 0 18px 40px -20px rgba(0,0,0,0.7);
    border-radius:22px;
    padding:26px 22px;
    margin-bottom:20px;
  }
  .summary-row{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:8px;
    padding:18px 0;
    border-bottom:1px solid var(--border-soft);
  }
  .summary-row:last-child{border-bottom:none;}
  .summary-row .s-label{
    font-size:11px;
    color:var(--accent-bright);
    letter-spacing:1.5px;
  }
  .summary-row .s-value{
    font-family:'Amiri','Vazirmatn',serif;
    font-size:18px;
    font-weight:700;
    line-height:1.8;
    text-align:center;
  }
  .summary-row img.s-img{
    max-width:100%;
    max-height:150px;
    border-radius:12px;
    margin:4px auto 0;
    display:block;
    object-fit:cover;
    border:1px solid var(--hairline);
  }
  .restart-btn{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent));
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:13px;
    padding:15px 16px;
    font-size:14px;
    font-family:inherit;
    font-weight:700;
    width:100%;
    cursor:pointer;
    margin-bottom:10px;
    box-shadow:0 10px 24px -12px rgba(143,23,32,0.7);
  }
  .home-link-btn{
    background:var(--surface);
    color:var(--text-dim);
    border:1px solid var(--border);
    border-radius:13px;
    padding:13px 16px;
    font-size:13px;
    font-family:inherit;
    font-weight:600;
    width:100%;
    cursor:pointer;
  }

  /* ---------- Manage ---------- */
  .export-row{
    display:flex;
    gap:8px;
    margin-bottom:14px;
  }
  .export-btn{
    display:block;
    width:100%;
    flex:1;
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text-dim);
    border-radius:11px;
    padding:12px 10px;
    font-size:12.5px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
  }
  .export-btn:active{color:var(--accent-bright); border-color:var(--accent-bright);}
  .security-section{
    margin-bottom:16px;
  }
  .pin-set-input{
    width:100%;
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text);
    border-radius:11px;
    padding:12px 14px;
    font-size:14px;
    font-family:inherit;
    text-align:center;
    letter-spacing:6px;
    margin-bottom:10px;
    box-sizing:border-box;
  }
  .add-submit-full{
    width:100%;
    background:linear-gradient(160deg, var(--accent-bright), var(--accent) 70%);
    color:#fff;
    border:1px solid rgba(255,255,255,0.12);
    border-radius:11px;
    padding:12px 14px;
    font-size:13.5px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
  }
  .lock-view{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    min-height:60vh;
    min-height:60dvh;
    padding-top:10px;
  }
  .lock-title{
    font-size:13.5px;
    color:var(--text-dim);
  }
  .pin-dots{
    display:flex;
    gap:16px;
  }
  .pin-dot{
    width:14px;
    height:14px;
    border-radius:50%;
    border:1px solid var(--border);
    background:transparent;
    transition:background 0.15s, border-color 0.15s;
  }
  .pin-dot.filled{
    background:var(--accent-bright);
    border-color:var(--accent-bright);
  }
  .pin-dots.error .pin-dot.filled{
    background:#ff5252;
    border-color:#ff5252;
  }
  .pin-error-text{
    color:#ff5252;
    font-size:12.5px;
    margin-top:-12px;
  }
  .keypad{
    display:grid;
    grid-template-columns:repeat(3, 64px);
    gap:16px;
    margin-top:6px;
  }
  .keypad-btn{
    width:64px;
    height:64px;
    border-radius:50%;
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text);
    font-size:19px;
    font-family:inherit;
    cursor:pointer;
  }
  .keypad-btn.empty{
    background:transparent;
    border:none;
    cursor:default;
  }
  .keypad-btn:active{background:var(--surface-2); border-color:var(--accent-bright);}
  .cat-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:16px;
  }
  .cat-tab{
    flex:1 1 calc(50% - 8px);
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text-dim);
    border-radius:11px;
    padding:11px 8px;
    font-size:12.5px;
    font-family:inherit;
    font-weight:600;
    cursor:pointer;
  }
  .cat-tab.active{
    background:linear-gradient(160deg, var(--accent-bright), var(--accent));
    border-color:rgba(255,255,255,0.12);
    color:#fff;
  }
  .owner-toggle{
    display:flex;
    gap:8px;
    margin-bottom:16px;
  }
  .owner-btn{
    flex:1;
    background:var(--surface);
    border:1px solid var(--border-soft);
    color:var(--text-dim);
    border-radius:11px;
    padding:11px 8px;
    font-size:13px;
    font-family:inherit;
    font-weight:700;
    cursor:pointer;
  }
  .owner-btn.active{
    background:var(--surface-2);
    border-color:var(--accent-bright);
    color:#fff;
    box-shadow:0 0 0 1px var(--hairline);
  }

  .add-card{
    background:var(--surface);
    border:1px solid var(--border-soft);
    box-shadow:0 0 0 1px rgba(198,40,50,0.06);
    border-radius:var(--radius);
    padding:18px;
    margin-bottom:18px;
  }
  .add-row{
    display:flex;
    gap:8px;
  }
  .add-row input[type=text]{

let lists = {};

let screen = 'home'; // home | dice | turn | play | summary | manage
let dice = [1, 1];
let diceRolling = false;
let diceWon = false;
let diceAttempts = 0;
let currentTurn = null; // 'man' | 'woman'
let currentStep = 0;
let selections = {};
let accordionOpen = {};

let pendingImage = {};
let editingItem = null;
let pendingEditImage = null;
let manageCategory = STEPS[0].id;
let manageOwner = 'man';

const PIN_KEY = 'sexgame-pin-v1';
let pinInput = '';
let pinError = false;
let securityFormOpen = false;

const STORAGE_KEY = 'sexgame-data-v4';
let idCounter = 1;
function nextId(){ return 'i' + (idCounter++); }

function displayText(t) {
  return (t && String(t).trim()) ? t : '';
}

function normalizeItem(raw){
  if (typeof raw === 'string') return { id: nextId(), text: raw, image: null };
  return { id: raw.id || nextId(), text: raw.text || '', image: raw.image || null };
}

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      STEPS.forEach(s => {
        const catData = parsed[s.id] || {};
        lists[s.id] = {
          man: Array.isArray(catData.man) ? catData.man.map(normalizeItem) : [],
          woman: Array.isArray(catData.woman) ? catData.woman.map(normalizeItem) : []
        };
      });
    }
  } catch (e) {}
  if (localStorage.getItem(PIN_KEY)) {
    screen = 'lock';
  }
  render();
}

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(lists));
    setStatus('');
  } catch (e) {
    setStatus('ذخیره نشد، حافظه مرورگر پر شده');
  }
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg;
}

function renderTopArea() {
  const top = document.getElementById('topArea');

function render() {
  renderHeader();

  else if (screen === 'turn') main.appendChild(buildTurnView());
  else if (screen === 'play') main.appendChild(buildPlayView());
  else if (screen === 'summary') main.appendChild(buildSummaryView());
  else if (screen === 'manage') main.appendChild(buildManageView());
}

/* ---------------- Lock ---------------- */
function buildLockView() {
  const wrap = document.createElement('div');
  wrap.className = 'view active lock-view';

  const title = document.createElement('div');
  title.className = 'lock-title';
  title.textContent = 'برای ورود، رمز رو وارد کن';
  wrap.appendChild(title);

  const dots = document.createElement('div');
  dots.className = 'pin-dots' + (pinError ? ' error' : '');
  for (let i = 0; i < 4; i++) {
    const dot = document.createElement('span');
    dot.className = 'pin-dot' + (i < pinInput.length ? ' filled' : '');
    dots.appendChild(dot);
  }
  wrap.appendChild(dots);

  if (pinError) {
    const err = document.createElement('div');
    err.className = 'pin-error-text';
    err.textContent = 'رمز اشتباهه';
    wrap.appendChild(err);
  }

  const pad = document.createElement('div');
  pad.className = 'keypad';
  const keys = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '', '0', '⌫'];
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'keypad-btn' + (k === '' ? ' empty' : '');
    btn.textContent = k;
    if (k === '') {
      btn.disabled = true;
    } else if (k === '⌫') {
      btn.onclick = () => {
        pinInput = pinInput.slice(0, -1);
        pinError = false;
        render();
      };
    } else {
      btn.onclick = () => {
        if (pinInput.length >= 4) return;
        pinInput += k;
        pinError = false;
        if (pinInput.length === 4) {
          const saved = localStorage.getItem(PIN_KEY);
          if (pinInput === saved) {
            pinInput = '';
            pinError = false;
            screen = 'home';
            render();
            return;
          } else {
            pinError = true;
            render();
            setTimeout(() => { pinInput = ''; pinError = false; render(); }, 600);
            return;
          }
        }
        render();
      };
    }
    pad.appendChild(btn);
  });
  wrap.appendChild(pad);

  return wrap;
}

/* ---------------- Home ---------------- */
function buildHomeView() {
  const wrap = document.createElement('div');
  wrap.className = 'view active home-view';

  const startBtn = document.createElement('button');

/* ---------------- Dice ---------------- */
function renderDieFace(value) {
  const die = document.createElement('div');
  if (value === 6) {
    die.className = 'die sex-face';
    const label = document.createElement('span');
    label.className = 'sex-label';
    label.textContent = 'SEX';
    die.appendChild(label);
    return die;
  }
  die.className = 'die';
  const PIP_MAP = {
    1: ['mm'],
    2: ['tl', 'br'],
    3: ['tl', 'mm', 'br'],
    4: ['tl', 'tr', 'bl', 'br'],
    5: ['tl', 'tr', 'mm', 'bl', 'br']
  };
  const positions = ['tl','tm','tr','ml','mm','mr','bl','bm','br'];
  const lit = PIP_MAP[value] || [];
  positions.forEach(pos => {
    const pip = document.createElement('div');
    pip.className = 'pip' + (lit.includes(pos) ? ' lit' : '');

  });
  return die;
}

function buildDiceView() {
  const wrap = document.createElement('div');

  if (!diceWon && diceAttempts >= 16) {
    const giveUpBtn = document.createElement('button');

function rollDice(stage, msg, btn, wrap) {
  btn.disabled = true;
  const dieEls = stage.querySelectorAll('.die');
  dieEls.forEach(d => d.classList.add('rolling'));
  msg.textContent = 'در حال انداختن...';
  getAudioCtx();

  let ticks = 0;
  const maxTicks = 12;
  const interval = setInterval(() => {
    const d1 = 1 + Math.floor(Math.random() * 6);
    const d2 = 1 + Math.floor(Math.random() * 6);
    stage.innerHTML = '';
    const f1 = renderDieFace(d1);
    const f2 = renderDieFace(d2);
    f1.classList.add('rolling');
    f2.classList.add('rolling');
    stage.appendChild(f1);
    stage.appendChild(f2);
    playDiceTick();
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      const final1 = 1 + Math.floor(Math.random() * 6);
      const final2 = 1 + Math.floor(Math.random() * 6);

/* ---------------- Sound (Web Audio, no external files) ---------------- */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playDiceTick() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(480 + Math.random() * 160, t);
  gain.gain.setValueAtTime(0.07, t);
  gain.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(t);
  osc.stop(t + 0.06);
}

function playWinFanfare() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  const t0 = ctx.currentTime;
  const notes = [523.25, 659.25, 783.99, 1046.50, 1318.51];
  notes.forEach((freq, i) => {
    const start = t0 + i * 0.09;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.14, start + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.38);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + 0.4);
  });
  for (let i = 0; i < 12; i++) {
    const start = t0 + Math.random() * 0.55;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1700 + Math.random() * 1600, start);
    gain.gain.setValueAtTime(0.0001, start);
    gain.gain.exponentialRampToValueAtTime(0.05, start + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + 0.22);
  }
}

function rollFor(s, wrapEl, textEl, imgEl, btn) {
  const list = lists[s.id][currentTurn];
  if (list.length === 0) return;
  btn.disabled = true;
  textEl.className = 'result-text rolling';
  imgEl.style.display = 'none';
  imgEl.classList.remove('settled');

  let ticks = 0;
  const maxTicks = 10;
  const interval = setInterval(() => {
    const r = list[Math.floor(Math.random() * list.length)];
    textEl.style.display = '';
    textEl.textContent = (r.text && r.text.trim()) ? r.text : '...';
    ticks++;
    if (ticks >= maxTicks) {
      clearInterval(interval);
      const final = list[Math.floor(Math.random() * list.length)];
      textEl.textContent = displayText(final.text);
      textEl.style.display = final.text && final.text.trim() ? '' : 'none';
      textEl.className = 'result-text settled';
      selections[s.id] = { text: final.text, image: final.image || null };
      if (final.image) {
        imgEl.src = final.image;
        imgEl.style.display = 'block';
        imgEl.classList.add('settled');
      }
      wrapEl.classList.add('pulsing');
      setTimeout(() => wrapEl.classList.remove('pulsing'), 550);
      btn.disabled = false;
      btn.textContent = 'دوباره بچرخون';
      updateNextButton();
    }
  }, 70);
}

function resizeImageFile(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) {
          h = Math.round(h * (maxWidth / w));
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function exportListsToTxt() {
  let out = 'Sex Game — خروجی آیتم‌ها\n';
  out += '========================\n\n';
  STEPS.forEach(s => {
    out += '# ' + s.label + '\n';
    ['man', 'woman'].forEach(ownerKey => {
      out += '-- ' + OWNERS[ownerKey] + ' --\n';
      const items = lists[s.id][ownerKey];
      if (!items || items.length === 0) {
        out += '(خالی)\n';
      } else {
        items.forEach((item, idx) => {
          out += (idx + 1) + '. ' + (item.text || '(بدون عنوان)') + (item.image ? ' [+عکس]' : '') + '\n';
        });
      }
      out += '\n';
    });
  });

  const blob = new Blob([out], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const today = new Date().toISOString().slice(0, 10);
  a.download = 'sex-game-items-' + today + '.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
  setStatus('فایل txt دانلود شد');
}

function importListsFromTxt(text) {
  const lines = text.split(/\r?\n/);
  let currentStepId = null;
  let currentOwner = null;
  let count = 0;

  lines.forEach(rawLine => {
    const line = rawLine.trim();
    if (!line) return;

    if (line.startsWith('# ')) {
      const label = line.slice(2).trim();
      const step = STEPS.find(x => x.label === label);
      currentStepId = step ? step.id : null;
      currentOwner = null;
      return;
    }

    const ownerMatch = line.match(/^--\s*(.+?)\s*--$/);
    if (ownerMatch) {
      const ownerLabel = ownerMatch[1].trim();
      const entry = Object.keys(OWNERS).find(k => OWNERS[k] === ownerLabel);
      currentOwner = entry || null;
      return;
    }

    if (line === '(خالی)') return;

    const itemMatch = line.match(/^\d+\.\s*(.*)$/);
    if (itemMatch && currentStepId && currentOwner) {
      let itemText = itemMatch[1].trim().replace(/\s*\[\+عکس\]\s*$/, '').trim();
      if (!itemText) return;
      lists[currentStepId][currentOwner].push({ id: nextId(), text: itemText, image: null });
      count++;
    }
  });

  return count;
}

  const addBtn = document.createElement('button');
  addBtn.className = 'add-submit';
  addBtn.textContent = '+';
  addBtn.setAttribute('aria-label', 'افزودن');

  const errorText = document.createElement('div');
  errorText.className = 'error-text';
  errorText.textContent = s.hasImage ? 'یه عنوان بنویس یا عکس اضافه کن' : 'چیزی بنویس';

  row.appendChild(input);
  row.appendChild(addBtn);
  wrap.appendChild(row);

  const pendingKey = s.id + '-' + owner;
  if (s.hasImage) {
    pendingImage[pendingKey] = null;
    const attach = document.createElement('div');
    attach.className = 'image-attach';

    const fileId = 'file-' + pendingKey;
    const label = document.createElement('label');
    label.className = 'file-btn';
    label.setAttribute('for', fileId);
    label.textContent = 'افزودن عکس';

    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*';
    fileInput.id = fileId;

    const thumb = document.createElement('img');
    thumb.className = 'thumb';

    const clearBtn = document.createElement('button');
    clearBtn.className = 'clear-img';
    clearBtn.textContent = '×';
    clearBtn.setAttribute('aria-label', 'حذف عکس');

    fileInput.addEventListener('change', async () => {
      const f = fileInput.files[0];
      if (!f) return;
      label.textContent = 'در حال آماده‌سازی...';
      try {
        const dataUrl = await resizeImageFile(f, 480, 0.75);
        pendingImage[pendingKey] = dataUrl;
        thumb.src = dataUrl;
        thumb.style.display = 'block';
        clearBtn.style.display = 'inline-block';
        label.textContent = 'تغییر عکس';
      } catch (e) {
        label.textContent = 'افزودن عکس';
        setStatus('بارگذاری عکس ناموفق بود');
      }
    });

    clearBtn.onclick = () => {
      pendingImage[pendingKey] = null;
      fileInput.value = '';
      thumb.style.display = 'none';
      clearBtn.style.display = 'none';
      label.textContent = 'افزودن عکس';
    };

    attach.appendChild(label);
    attach.appendChild(fileInput);
    attach.appendChild(thumb);
    attach.appendChild(clearBtn);
    wrap.appendChild(attach);
  }

  wrap.appendChild(errorText);

  function submit() {
    const val = input.value.trim();
    const hasPendingImg = s.hasImage && !!pendingImage[pendingKey];
    if (!val && !hasPendingImg) {
      errorText.style.display = 'block';
      return;
    }
    errorText.style.display = 'none';
    const item = { id: nextId(), text: val, image: s.hasImage ? (pendingImage[pendingKey] || null) : null };
    lists[s.id][owner].push(item);
    input.value = '';
    if (s.hasImage) pendingImage[pendingKey] = null;
    saveData();
    render();
  }

  input.addEventListener('input', () => { errorText.style.display = 'none'; });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') submit(); });
  addBtn.onclick = submit;

  return wrap;
}

        const delBtn = document.createElement('button');
        delBtn.className = 'del-btn';
        delBtn.textContent = '×';
        delBtn.setAttribute('aria-label', 'حذف');
        delBtn.onclick = () => {
          lists[s.id][owner].splice(idx, 1);
          saveData();
          render();
        };
        li.appendChild(liMain);
        li.appendChild(editBtn);
        li.appendChild(delBtn);
      }
      ul.appendChild(li);
    });
    inner.appendChild(ul);
  }

  body.appendChild(inner);

  head.onclick = () => {
    accordionOpen[accKey] = !accordionOpen[accKey];
    head.classList.toggle('open', accordionOpen[accKey]);
    body.style.maxHeight = accordionOpen[accKey] ? inner.scrollHeight + 'px' : '0px';
  };

  wrap.appendChild(head);
  wrap.appendChild(body);

  if (accordionOpen[accKey]) {
    requestAnimationFrame(() => { body.style.maxHeight = inner.scrollHeight + 'px'; });
  }

  return wrap;
}

loadData();
</script>

</body>
</html>
